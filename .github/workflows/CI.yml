name: FFmpeg Windows x64 (Master + FDK AAC + xHE-AAC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-win64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_ffmpeg:
    name: Build win64 ${{ matrix.variant }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [win64]
        variant: [nonfree, nonfree-shared]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve latest FFmpeg master commit
        id: ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api repos/FFmpeg/FFmpeg/commits/master --jq '.sha')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building FFmpeg master commit: $SHA"

      - name: Build local Docker toolchain and dependency image
        run: |
          set -euo pipefail
          ./makeimage.sh "${{ matrix.target }}" "${{ matrix.variant }}"

      - name: Compile FFmpeg
        env:
          FFMPEG_COMMIT: ${{ steps.ffmpeg.outputs.sha }}
        run: |
          set -euo pipefail
          ./build.sh "${{ matrix.target }}" "${{ matrix.variant }}"

      - name: Verify generated package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.tar.zst)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one .tar.zst package; found ${#files[@]}"
            find artifacts -maxdepth 2 -type f -printf '%p (%s bytes)\n' || true
            exit 1
          fi
          test -s "${files[0]}"
          zstd -t "${files[0]}"
          sha256sum "${files[0]}" > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload FFmpeg package
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target }}-${{ matrix.variant }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
